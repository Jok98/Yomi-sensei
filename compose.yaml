services:
  yomi-sensei:
    build:
      context: .
    ports:
      - "127.0.0.1:8787:8000"
    environment:
      CODEX_HOME: "/home/node/.codex"
      CODEX_MODEL: "${CODEX_MODEL:-}"
      CODEX_TIMEOUT_SECONDS: "${CODEX_TIMEOUT_SECONDS:-120}"
      STOCKFISH_PATH: "/usr/games/stockfish"
      STOCKFISH_DEPTH: "${STOCKFISH_DEPTH:-16}"
    volumes:
      - codex-auth:/home/node/.codex
    init: true
    restart: unless-stopped

volumes:
  codex-auth:
